<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студент парақшасы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h1 { color: #38bdf8; margin-bottom: 8px; }
        p { color: #94a3b8; margin: 5px 0; }
        .tag {
            display: inline-block;
            margin-top: 15px;
            background: #0284c7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Аумажикова Салтанат, АҚЖ-31</h1>
        <p>Еуразия Ұлттық университеті</p>
        <p>Киберқауіпсіздік мамандығы</p>
        <div class="tag">Docker + Nginx Container</div>
    </div>
</body>
</html>
